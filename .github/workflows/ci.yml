name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fit-feed

env:
  # Emulator-backed suites and the Playwright API suite skip themselves when
  # their dependency is missing. In CI that dependency is always started, so
  # a skip means the harness broke - fail instead of reporting green.
  FITFEED_FORBID_SKIPS: "1"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------- hygiene
  hygiene:
    name: Secrets and git hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan reads committed history, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tracked files, credentials and secret patterns
        # Same script a developer runs locally (npm run check:secrets), so the
        # two can never drift apart. Needs no dependencies beyond node + git.
        run: node scripts/check-hygiene.mjs

  # --------------------------------------------------------------- frontend
  frontend:
    name: Build, lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fit-feed/package-lock.json

      - run: npm ci

      - name: TypeScript build
        run: npx tsc -b

      - name: ESLint (zero warnings tolerated)
        run: npx eslint . --max-warnings 0

      - name: Production bundle
        run: npx vite build

      - name: Audit production dependencies
        # Dev-only advisories are reported but do not fail the build; see
        # docs/security.md for why (the offered "fix" is a 4-major downgrade
        # of firebase-tools). Anything reaching users must be clean.
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit || echo "::warning::dev-only advisories present; see docs/security.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: fit-feed/dist
          retention-days: 5

  # -------------------------------------------------- rules + component tests
  emulator-tests:
    name: Firestore rules and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fit-feed/package-lock.json

      - name: Java for the Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('fit-feed/firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - run: npm ci

      - name: Transitional rules are in sync with their generator
        # firestore.transition.rules is generated from firestore.rules. If
        # somebody edits either without regenerating, the file we would deploy
        # during the migration window is not the file anybody reviewed.
        run: npm run rules:check

      - name: Rules and component suites under the emulators
        run: |
          npx firebase emulators:exec \
            --only firestore,storage \
            --project fitfeed-rules-test \
            "npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json"

      - name: No test was skipped
        run: node scripts/assert-no-skips.mjs vitest-report.json --label "vitest"

  # ------------------------------------------------------------- backend
  backend-tests:
    name: Python tests under the Firestore emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fit-feed/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version-file: fit-feed/python-backend/.python-version
          cache: pip
          cache-dependency-path: fit-feed/python-backend/requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('fit-feed/firebase.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - run: npm ci

      - name: Install Python dependencies
        run: pip install -r python-backend/requirements-dev.txt

      - name: Dead code and unused imports
        run: python -m pyflakes $(git ls-files 'python-backend/*.py')

      - name: Audit Python dependencies
        # Runs here rather than locally: a corporate TLS-intercepting proxy
        # makes pip-audit unable to verify pypi.org on the dev machine.
        run: |
          pip install pip-audit
          pip-audit -r python-backend/requirements.txt --progress-spinner off

      - name: pytest under the Firestore emulator
        run: |
          npx firebase emulators:exec \
            --only firestore \
            --project fitfeed-rules-test \
            "cd python-backend && python -m pytest -q"

      - name: Recommendation evaluation harness
        run: |
          cd python-backend
          python evaluate_recommendations.py --json --out ../evaluation.json
          python -c "import json;d=json.load(open('../evaluation.json'));assert d['metrics']['determinism']['identical_across_runs'];print('harness ok')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recommendation-evaluation
          path: fit-feed/evaluation.json
          retention-days: 30

  # --------------------------------------------------------- integration
  integration:
    name: Playwright UI and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: fit-feed/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version-file: fit-feed/python-backend/.python-version
          cache: pip
          cache-dependency-path: fit-feed/python-backend/requirements-dev.txt

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fit-feed/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Python dependencies
        run: pip install -r python-backend/requirements-dev.txt

      - name: Start the Flask API
        # No credentials, so Firestore-backed routes answer 503. The API
        # suite asserts the auth and validation contract, which does not
        # need a datastore - and must not silently skip.
        run: |
          cd python-backend
          python app.py &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health > /dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy"; exit 1

      - name: Playwright API contract suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-api.json
        run: npx playwright test --project=api --reporter=json

      - name: Every API test executed
        run: node scripts/assert-no-skips.mjs playwright-api.json --label "playwright api"

      - name: Playwright UI suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-ui.json
        run: npx playwright test --project=ui --reporter=json

      - name: Every UI test executed
        run: node scripts/assert-no-skips.mjs playwright-ui.json --label "playwright ui"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: fit-feed/test-results
          retention-days: 7

  # ------------------------------------------------------------------ gate
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [hygiene, frontend, emulator-tests, backend-tests, integration]
    if: always()
    steps:
      - name: Every required job succeeded
        # This job checks out nothing, so it cannot inherit the repository-wide
        # `working-directory: fit-feed` default - bash would try to start in a
        # directory that does not exist on the runner.
        working-directory: .
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
          echo "All required checks passed."
